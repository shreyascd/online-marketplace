{% extends "base.html" %}
{% block title %}{{ code }} · ShopLite{% endblock %}

{% block content %}
<div class="text-center py-5">
  <div class="display-1 fw-bold text-muted">{{ code }}</div>
  <h1 class="h3 mt-2">{{ title }}</h1>
  <p class="text-muted mb-4">{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('index') }}">Back to the shop</a>
</div>
{% endblock %}
